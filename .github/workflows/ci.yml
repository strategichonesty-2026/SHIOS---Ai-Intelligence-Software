name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-fast:
    name: Backend (lint + fast tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint
        working-directory: backend
        run: ruff check app tests
      - name: Verify migrations apply from empty
        working-directory: backend
        env:
          DATABASE_URL: sqlite+pysqlite:///./ci.db
        run: alembic upgrade head
      - name: Fast tests (governance, stats, retry)
        working-directory: backend
        run: pytest -q -m "not slow" --cov=app --cov-report=term-missing

  backend-slow:
    name: Backend (full loop tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Full loop tests
        working-directory: backend
        run: pytest -q -m slow --cov=app --cov-report=term-missing --cov-fail-under=80

  frontend:
    name: Frontend (type-check + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci || npm install
      - name: Type-check and build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
        run: npm run build

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [backend-fast]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t shios-backend ./backend
