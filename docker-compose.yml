name: shios

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: shios
      POSTGRES_PASSWORD: shios
      POSTGRES_DB: shios
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shios -d shios"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    entrypoint: ["/app/entrypoint.sh"]
    environment:
      DATABASE_URL: postgresql+psycopg://shios:shios@postgres:5432/shios
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: http://localhost:3000
      ENABLED_SOURCES: ${ENABLED_SOURCES:-sample_jobs}
      LLM_PROVIDER: ${LLM_PROVIDER:-rule}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      API_KEY: ${API_KEY:-}
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-false}
      BOOTSTRAP_ON_START: ${BOOTSTRAP_ON_START:-true}
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
    environment:
      API_BASE_URL: http://backend:8000/api/v1
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
      SHIOS_API_KEY: ${API_KEY:-}
    ports: ["3000:3000"]
    depends_on: [backend]

volumes:
  postgres_data:
